<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Ingresso Scuola - Online Google Sheets</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome per Icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse per leggere i file CSV di Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; background-color: #f0f7ff; }

        .marquee-container {
            position: relative;
            overflow: hidden;
            height: 100%;
            mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
        }

        .marquee-track {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: scrollDown 45s linear infinite;
        }

        .marquee-container:hover .marquee-track { animation-play-state: paused; }

        @keyframes scrollDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0%); }
        }

        .ticker-wrap { width: 100%; overflow: hidden; white-space: nowrap; }
        .ticker { display: inline-block; animation: ticker 40s linear infinite; }
        .ticker-wrap:hover .ticker { animation-play-state: paused; }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(186, 214, 245, 0.8);
            box-shadow: 0 10px 30px -5px rgba(147, 197, 253, 0.4);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-slate-900 bg-gradient-to-br from-sky-100 via-blue-50 to-indigo-100">

    <!-- HEADER SUPERIORE -->
    <header class="h-24 px-6 bg-gradient-to-r from-blue-950 via-sky-950 to-indigo-950 text-white flex items-center justify-between shadow-lg z-10 shrink-0 border-b border-blue-900">
        <div class="flex items-center space-x-4">
            <div class="w-16 h-16 bg-gradient-to-tr from-sky-500 to-blue-600 text-white rounded-2xl flex items-center justify-center shadow-md shadow-sky-500/20 overflow-hidden shrink-0">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>
            <div>
                <h1 id="schoolName" class="text-2xl font-black text-white tracking-tight leading-none mb-1.5">
                    Istituto Comprensivo "Gianni Rodari"
                </h1>
                <p id="schoolContacts" class="text-xs font-bold text-sky-300 flex items-center gap-4">
                    <span><i class="fa-solid fa-location-dot text-sky-400 mr-1.5"></i>Via Garibaldi 12, Torino</span>
                    <span><i class="fa-solid fa-phone text-sky-400 mr-1.5"></i>011 0001122</span>
                    <span><i class="fa-solid fa-envelope text-sky-400 mr-1.5"></i>toic80000x@istruzione.it</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-4 bg-blue-900/70 border border-blue-700/60 rounded-2xl px-5 py-2 shadow-inner">
            <div class="text-right">
                <div id="clock" class="text-3xl font-black text-white font-mono tracking-tight leading-none mb-0.5">00:00:00</div>
                <div id="date" class="text-xs font-bold text-sky-200 capitalize">Caricamento data...</div>
            </div>
            <div class="w-10 h-10 rounded-xl bg-sky-500 text-white flex items-center justify-center text-lg shadow-sm">
                <i class="fa-solid fa-clock"></i>
            </div>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="flex-1 grid grid-cols-12 gap-5 p-5 min-h-0">
        <!-- AVVISI -->
        <section class="col-span-4 glass-card rounded-2xl p-4 flex flex-col h-full overflow-hidden">
            <div class="flex items-center justify-between pb-3 mb-2 border-b-2 border-blue-900 shrink-0">
                <div class="flex items-center space-x-2.5">
                    <span class="w-9 h-9 rounded-xl bg-blue-900 text-white flex items-center justify-center text-base shadow-sm">
                        <i class="fa-solid fa-bullhorn"></i>
                    </span>
                    <h2 class="text-lg font-black text-blue-950 tracking-wide">Avvisi & Comunicazioni</h2>
                </div>
                <span class="text-xs font-extrabold px-3 py-1 bg-blue-100 text-blue-900 rounded-full border border-blue-200">In evidenza</span>
            </div>
            <div class="marquee-container flex-1">
                <div id="avvisiTrack" class="marquee-track"></div>
            </div>
        </section>

        <!-- FOTO SLIDER -->
        <section class="col-span-4 glass-card rounded-2xl p-4 flex flex-col h-full overflow-hidden">
            <div class="flex items-center justify-between pb-3 mb-2 border-b-2 border-blue-900 shrink-0">
                <div class="flex items-center space-x-2.5">
                    <span class="w-9 h-9 rounded-xl bg-blue-900 text-white flex items-center justify-center text-base shadow-sm">
                        <i class="fa-solid fa-images"></i>
                    </span>
                    <h2 class="text-lg font-black text-blue-950 tracking-wide">Vita Scolastica</h2>
                </div>
                <span class="text-xs font-extrabold px-3 py-1 bg-blue-100 text-blue-900 rounded-full border border-blue-200">Galleria</span>
            </div>

            <div class="relative flex-1 bg-sky-100/60 rounded-xl overflow-hidden shadow-inner">
                <div id="photoSlider" class="w-full h-full relative"></div>
                <div class="absolute bottom-3 left-3 right-3 bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-xl border border-blue-200 shadow-lg">
                    <p id="photoCaption" class="text-xs font-extrabold text-blue-950 truncate">Caricamento foto...</p>
                </div>
            </div>
        </section>

        <!-- EVENTI -->
        <section class="col-span-4 glass-card rounded-2xl p-4 flex flex-col h-full overflow-hidden">
            <div class="flex items-center justify-between pb-3 mb-2 border-b-2 border-indigo-900 shrink-0">
                <div class="flex items-center space-x-2.5">
                    <span class="w-9 h-9 rounded-xl bg-indigo-900 text-white flex items-center justify-center text-base shadow-sm">
                        <i class="fa-solid fa-calendar-days"></i>
                    </span>
                    <h2 class="text-lg font-black text-indigo-950 tracking-wide">Prossimi Eventi</h2>
                </div>
                <span class="text-xs font-extrabold px-3 py-1 bg-indigo-100 text-indigo-900 rounded-full border border-indigo-200">Calendario</span>
            </div>
            <div class="marquee-container flex-1">
                <div id="eventiTrack" class="marquee-track"></div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white/95 backdrop-blur-md border-t border-sky-200 shrink-0 z-10 shadow-lg">
        <!-- BARRA INFERIORE: ORARI SEGRETERIA + DOVE SI TROVA LA CLASSE -->
        <div class="grid grid-cols-3 gap-4 px-6 py-2.5 border-b border-sky-200 bg-sky-50/60">
            <!-- Segreteria Famiglie -->
            <div class="flex items-center space-x-3 bg-white p-2.5 rounded-xl border-2 border-blue-200 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-blue-900 text-white flex items-center justify-center text-lg shrink-0 shadow">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="truncate">
                    <span class="text-xs font-black uppercase tracking-wider text-blue-950 block">Segreteria Famiglie / Alunni</span>
                    <span class="text-xs font-bold text-slate-700 truncate block">Lun - Ven: 08:00 - 10:00</span>
                </div>
            </div>

            <!-- Segreteria Personale -->
            <div class="flex items-center space-x-3 bg-white p-2.5 rounded-xl border-2 border-indigo-200 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-indigo-900 text-white flex items-center justify-center text-lg shrink-0 shadow">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <div class="truncate">
                    <span class="text-xs font-black uppercase tracking-wider text-indigo-950
